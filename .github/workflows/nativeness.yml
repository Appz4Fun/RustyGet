# Informational: scores how idiomatic the Rust is (docs/nativeness/README.md)
# and puts the report, with deltas against the committed baseline, in the job
# summary. Not a required check; it never fails a PR on the score.
# No credentials are used; pull-request code runs with a read-only token.
name: nativeness

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'scripts/nativeness/**'
      - 'docs/nativeness/**'
      - '.github/workflows/nativeness.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nativeness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: 3
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 update \
              && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
                build-essential pkg-config libssl-dev; then
              exit 0
            fi
            sleep $((attempt * 30))
          done
          exit 1

      - name: Install Rust toolchain with clippy
        working-directory: rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          key: nativeness
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Scorecard unit tests
        run: python3 -B -m unittest discover -s scripts/nativeness/tests

      - name: Score
        run: |
          python3 scripts/nativeness/score.py --run-clippy \
            --compare docs/nativeness/baseline.json \
            --json nativeness.json --markdown nativeness.md
          cat nativeness.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nativeness
          path: |
            nativeness.json
            nativeness.md
          retention-days: 90
