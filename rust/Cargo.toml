[package]
name = "nzbget-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false

[lib]
name = "nzbget_rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
par-rs = { git = "https://github.com/xbmc4lyfe/par-rs", branch = "main" }
zipfast = { git = "https://github.com/xbmc4lyfe/zipfast", rev = "7c681b66a603d36b9ed603ed49f0630a37f9617b" }
zipview = { git = "https://github.com/xbmc4lyfe/zipview", rev = "2c3d73a06b29987cea1510e903e437a482076745" }
nntmux-yenc = { git = "https://github.com/xbmc4lyfe/newznab-tmux", rev = "8dade08ca0372e046af2bd9d3040e23a47379bd4" }
crc32fast = "1.5"
flate2 = { version = "1.1", features = ["zlib-rs"] }
bzip2 = "0.6"
zstd = "0.14"
libc = "0.2"
quick-xml = { version = "0.41", features = ["encoding"] }
md-5 = "0.11"
openssl = "0.10"
openssl-sys = "0.9"

[dev-dependencies]
# Kernel diagnostics only; complete C++/Rust caller measurements remain the gate.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[test]]
name = "dupepurge_planner"
path = "tests/dupepurge/planner.rs"

[[test]]
name = "dupepurge_journal"
path = "tests/dupepurge/journal.rs"

[[bench]]
name = "ports"
harness = false

[[bench]]
name = "criterion_ports"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = 1

[profile.dev]
panic = "abort"
