[package]
name = "nzbget-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
publish = false
build = "build.rs"

[lib]
name = "nzbget_rs"
crate-type = ["rlib"]

# The daemon binary: rust/entry.rs owns `main` and links the tier check that
# build.rs compiles (see rust/tiercheck.rs).
[[bin]]
name = "rustyget"
path = "entry.rs"
test = false
bench = false
doctest = false

[dependencies]
par-rs = { git = "https://github.com/Appz4Fun/par-rs", rev = "cd1703f58dfb29f40da02957310739eb37d87b0f" }
zipfast = { git = "https://github.com/Appz4Fun/zipfast", rev = "e011073da7a6775281169cb31899749564526d5a", features = ["persistent-partials"] }
vidmatch = { git = "https://github.com/Appz4Fun/vidmatch", rev = "636facc1223d2a87e5ca7a43bc1d2e169c39deb6" }
zipview = { git = "https://github.com/xbmc4lyfe/zipview", rev = "2c3d73a06b29987cea1510e903e437a482076745" }
# nntp-rs v0.4.0
nntp-rs = { git = "https://github.com/Appz4Fun/nntp-rs", rev = "d475ec16604052dfd1e3c103de360973305c8a31", default-features = false, features = ["blocking", "openssl"] }
crc32fast = "1.5"
flate2 = { version = "1.1", features = ["zlib-rs"] }
bzip2 = "0.6"
zstd = "0.14"
libc = "0.2"
quick-xml = { version = "0.41", features = ["encoding"] }
md-5 = "0.11"
openssl = "0.10"
openssl-sys = "0.9"
yaml-rust2 = { version = "0.10", default-features = false }

[dev-dependencies]
# Kernel diagnostics only; complete C++/Rust caller measurements remain the gate.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[test]]
name = "dupepurge_planner"
path = "tests/dupepurge/planner.rs"

[[test]]
name = "dupepurge_journal"
path = "tests/dupepurge/journal.rs"

[[bench]]
name = "ports"
harness = false

[[bench]]
name = "yenc_decode"
harness = false

[[bench]]
name = "criterion_ports"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = 1

[profile.dev]
panic = "abort"
