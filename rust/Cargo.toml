[package]
name = "nzbget-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
publish = false

[lib]
name = "nzbget_rs"
crate-type = ["staticlib", "rlib"]

[dependencies]
rust-par2 = { git = "https://github.com/TheDancingDeveloper-org/Rust-PAR2", rev = "dac531170ab6a8954d5a0c2cf8da6d4adce0a2bf" }
zipfast = { git = "https://github.com/xbmc4lyfe/zipfast", rev = "4443e1c2923c2cbeb10d8559b56effd76c9e31b1" }
zipview = { git = "https://github.com/xbmc4lyfe/zipview", rev = "a1c381b93b92d5eac51adb5e177c5394c2ca20bb" }
quick-xml = { version = "0.41", features = ["encoding"] }
md-5 = "0.11"

[dev-dependencies]
# Kernel diagnostics only; complete C++/Rust caller measurements remain the gate.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[test]]
name = "dupepurge_planner"
path = "tests/dupepurge/planner.rs"

[[test]]
name = "dupepurge_journal"
path = "tests/dupepurge/journal.rs"

[[bench]]
name = "ports"
harness = false

[[bench]]
name = "criterion_ports"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = 1

[profile.dev]
panic = "abort"
