[package]
name = "nzbget-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
publish = false
build = "build.rs"

[lib]
name = "nzbget_rs"
crate-type = ["rlib"]

# The daemon binary: rust/entry.rs owns `main` and links the tier check that
# build.rs compiles (see rust/tiercheck.rs).
[[bin]]
name = "rustyget"
path = "entry.rs"
test = false
bench = false
doctest = false

[dependencies]
par-rs = { git = "https://github.com/Appz4Fun/par-rs", rev = "be3449b1e554a1d0312ddcc33584229e95cf5b60" }
zipfast = { git = "https://github.com/Appz4Fun/zipfast", rev = "01dadb5485d6e94421c8ed0773462b4ef350e003", features = ["persistent-partials"] }
vidmatch = { git = "https://github.com/Appz4Fun/vidmatch", rev = "636facc1223d2a87e5ca7a43bc1d2e169c39deb6" }
zipview = { git = "https://github.com/xbmc4lyfe/zipview", rev = "2c3d73a06b29987cea1510e903e437a482076745" }
# nntp-rs v0.4.4
nntp-rs = { git = "https://github.com/Appz4Fun/nntp-rs", rev = "48be0a9e0eb61e47325756eed52625777bdef9a0", default-features = false, features = ["blocking", "openssl"] }
crc32fast = "1.5"
flate2 = { version = "1.1", features = ["zlib-rs"] }
bzip2 = "0.6"
zstd = "0.14"
libc = "0.2"
quick-xml = { version = "0.41", features = ["encoding"] }
md-5 = "0.11"
openssl = "0.10"
openssl-sys = "0.9"
yaml-rust2 = { version = "0.10", default-features = false }

[dev-dependencies]
# Kernel diagnostics only; complete C++/Rust caller measurements remain the gate.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[test]]
name = "dupepurge_planner"
path = "tests/dupepurge/planner.rs"

[[test]]
name = "dupepurge_journal"
path = "tests/dupepurge/journal.rs"

[[bench]]
name = "ports"
harness = false

[[bench]]
name = "yenc_decode"
harness = false

[[bench]]
name = "criterion_ports"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = 1

# Debug and test builds (the test profile inherits this) keep file:line in panics,
# backtraces and gdb/lldb `bt`, but no variable debug info: 4-9 s less per
# `cargo build --tests` on the build farm (benchmark LB-1). For a debugger session
# with variables, build with CARGO_PROFILE_DEV_DEBUG=true.
[profile.dev]
panic = "abort"
debug = "line-tables-only"
