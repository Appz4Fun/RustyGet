[package]
name = "nzbget-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
publish = false
build = "build.rs"

[lib]
name = "nzbget_rs"
crate-type = ["rlib"]

# The daemon binary: rust/entry.rs owns `main` and links the tier check that
# build.rs compiles (see rust/tiercheck.rs).
[[bin]]
name = "rustyget"
path = "entry.rs"
test = false
bench = false
doctest = false

[dependencies]
par-rs = { git = "https://github.com/xbmc4lyfe/par-rs", rev = "48d8f957e54e6c96f1a3449f69109ec2661f0142" }
zipfast = { git = "https://github.com/xbmc4lyfe/zipfast", rev = "fd8ad9630821f6b54bed2d0026e0bb329c0db3b9", features = ["persistent-partials"] }
zipview = { git = "https://github.com/xbmc4lyfe/zipview", rev = "2c3d73a06b29987cea1510e903e437a482076745" }
nntmux-yenc = { git = "https://github.com/xbmc4lyfe/newznab-tmux", rev = "8dade08ca0372e046af2bd9d3040e23a47379bd4" }
crc32fast = "1.5"
flate2 = { version = "1.1", features = ["zlib-rs"] }
bzip2 = "0.6"
zstd = "0.14"
libc = "0.2"
quick-xml = { version = "0.41", features = ["encoding"] }
md-5 = "0.11"
openssl = "0.10"
openssl-sys = "0.9"
yaml-rust2 = { version = "0.10", default-features = false }

[dev-dependencies]
# Kernel diagnostics only; complete C++/Rust caller measurements remain the gate.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[test]]
name = "dupepurge_planner"
path = "tests/dupepurge/planner.rs"

[[test]]
name = "dupepurge_journal"
path = "tests/dupepurge/journal.rs"

[[bench]]
name = "ports"
harness = false

[[bench]]
name = "yenc_decode"
harness = false

[[bench]]
name = "criterion_ports"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = 1

[profile.dev]
panic = "abort"
