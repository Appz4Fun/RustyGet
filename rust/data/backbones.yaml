# Usenet backbones: the companies that store the articles, and the providers
# that sell access to them. Servers on the same backbone hold the same articles.
# Source: https://usenet.rexum.space/tree#table, 2026-11-15.
#
# backbones: backbone -> providers (block style, one provider per line).
# domains:   provider -> website domain. A host under one of these domains is
#            only SUGGESTED in Settings; the user confirms it.
# hosts:     confirmed NNTP host -> backbone. Only these fill in automatically.
#            Add a host here only when you know which backbone it reads from.

