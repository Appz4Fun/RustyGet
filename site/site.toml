# Site settings. To rename the project, change name, name_head, name_tail
# and crate here, then replace the name in site/content and README.md.

[site]
name = "RustyGet"
name_head = "Rusty"
name_tail = "Get"
crate = "rustyget"
tagline = "a fleet-aware Usenet downloader, rewritten in Rust"
status = "rewrite in progress"
repo = "https://github.com/Appz4Fun/RustyGet"
# Source links use the branch being built (GITHUB_REF_NAME in Actions), else this one.
branch = "main"
base_url = "https://rustyget.xbmc4lyfe.com/"

